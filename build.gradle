plugins {
	id 'java-library'
	id 'eclipse'
}

group = 'etri'
version = '0.1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}
tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

repositories {
	mavenCentral()
}

dependencies {
	// RobotTwinOperation과 MoveLinear의 공개 실행 API가 utils.async 타입을 노출한다.
	api project(':utils')

	// 공개 API 가 JsonNode 를 주고받는다.
	api libs.jackson.databind
	// 공개 API RobotTwinClient.Builder.httpClient(OkHttpClient) 가 OkHttpClient 를 받는다.
	// (utils 는 okhttp 를 implementation 으로만 선언하므로 여기서 api 로 내보낸다.)
	api libs.okhttp
	implementation libs.slf4j.api

	compileOnly libs.jetbrains.annotations		// @Nullable
	compileOnly libs.findbugs.jsr305	// @GuardedBy

	testImplementation libs.junit.jupiter
	testRuntimeOnly libs.junit.platform.launcher
	testImplementation libs.okhttp.mockwebserver
	testCompileOnly libs.jetbrains.annotations
}

// 사용 예제 — 라이브러리 jar 에 넣지 않는다. 실행:
//   gradle runExample -Pexample=MoveLinearExample [--args='--url http://10.0.0.5:8801']
sourceSets {
	examples {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
	}
}

tasks.register('runExample', JavaExec) {
	group = 'application'
	description = 'Runs an example in mdt.robot.client.examples (-Pexample=<class name>)'
	classpath = sourceSets.examples.runtimeClasspath
	mainClass = providers.gradleProperty('example').map { "mdt.robot.client.examples.${it}" }
	standardInput = System.in
}

tasks.named('test') {
	useJUnitPlatform()
}

eclipse {
	classpath {
		file {
			whenMerged { cp ->
				// :utils 를 Eclipse 프로젝트로 연결하므로 그 빌드 산출 jar 는 classpath 에서 뺀다.
				def utilsLibDir = project(':utils').projectDir.toPath().resolve('build/libs')
											.toUri().getPath().replaceAll('/+$', '')
				cp.entries.removeAll { entry ->
					entry.kind == 'lib' && entry.path != null && entry.path.startsWith(utilsLibDir + '/')
				}
			}
		}
	}
}
